name: ma_tontine
description: "Application mobile de gestion associative (tontines, caisses, épargne, prêts)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1

  # Stockage local
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF / Export
  pdf: ^3.11.0
  printing: ^5.13.2
  path_provider: ^2.1.3
  csv: ^6.0.0
  share_plus: ^9.0.0

  # Utilitaires
  uuid: ^4.4.2
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.2.1
  connectivity_plus: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
